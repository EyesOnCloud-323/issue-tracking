name: Feature request
description: Suggest a new feature
title: "[Feature] "
labels: ["type: feature", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting a feature. Please fill in the fields below.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: importance
    attributes:
      label: How important is this?
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues first
          required: true
